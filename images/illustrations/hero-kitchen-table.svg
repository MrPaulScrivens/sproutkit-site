<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Tabletop scene on a pine background: document, mug, small sprout -->

  <!-- Document, angled slightly, sitting on the table -->
  <g transform="translate(60 60) rotate(-4)">
    <rect x="0" y="0" width="190" height="220" rx="16" fill="#F6F1E7" />
    <rect x="28" y="40" width="134" height="16" rx="8" fill="#7FA396" />
    <rect x="28" y="76" width="110" height="16" rx="8" fill="#2C6B5F" />
    <rect x="28" y="112" width="134" height="16" rx="8" fill="#F0A886" />
    <rect x="28" y="148" width="90" height="16" rx="8" fill="#7FA396" />
  </g>

  <!-- Mug, upper right -->
  <g transform="translate(272 70)">
    <rect x="0" y="16" width="72" height="66" rx="18" fill="#2C6B5F" />
    <path d="M72 32 h16 a18 18 0 0 1 0 36 h-16 z" fill="#2C6B5F" />
    <rect x="0" y="16" width="72" height="18" rx="9" fill="#7FA396" />
  </g>

  <!-- Small potted sprout, lower right -->
  <g transform="translate(266 176)">
    <path d="M35 8 a5 5 0 0 1 5 5 c0 8 3 16 0 28 a5 5 0 0 1 -5 5 a5 5 0 0 1 -5 -5 c-3 -12 0 -20 0 -28 a5 5 0 0 1 5 -5 z" fill="#7FA396" />
    <ellipse cx="18" cy="20" rx="18" ry="13" fill="#7FA396" />
    <ellipse cx="60" cy="14" rx="16" ry="12" fill="#2C6B5F" />
    <path d="M6 46 h68 l-8 56 a10 10 0 0 1 -10 9 h-32 a10 10 0 0 1 -10 -9 z" fill="#F0A886" />
  </g>
</svg>
